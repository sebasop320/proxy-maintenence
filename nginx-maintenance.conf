# Paste into: Proxy Host -> Edit -> Advanced tab -> "Custom Nginx Configuration"
# Serves a maintenance page for every request to this site (HTTP 503).

default_type text/html;
add_header Retry-After 3600 always;
add_header Cache-Control "no-store" always;

return 503 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Under Maintenance</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#2b2f36;text-align:center}.box{max-width:480px;padding:40px}h1{font-size:2rem;margin-bottom:12px}p{font-size:1.1rem;line-height:1.5;color:#5a6270}.icon{font-size:4rem}</style></head><body><div class="box"><div class="icon">&#128679;</div><h1>We will be back soon</h1><p>This site is currently under maintenance. Please check back in a little while. Thank you for your patience.</p></div></body></html>';
